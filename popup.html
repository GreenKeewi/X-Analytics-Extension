<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  body { font-family: -apple-system, Segoe UI, Roboto, sans-serif; width: 260px; margin: 0; padding: 16px; background: #0f1419; color: #e7e9ea; }
  h1 { font-size: 15px; margin: 0 0 12px; font-weight: 600; }
  .stat { display: flex; justify-content: space-between; padding: 6px 0; font-size: 13px; border-bottom: 1px solid #2f3336; }
  .stat span:last-child { font-weight: 600; }
  button { width: 100%; margin-top: 14px; padding: 10px; background: #1d9bf0; color: #fff; border: none; border-radius: 999px; font-weight: 600; cursor: pointer; font-size: 13px; }
  button:hover { background: #1a8cd8; }
  .hint { font-size: 11px; color: #71767b; margin-top: 10px; line-height: 1.4; }
</style>
</head>
<body>
  <h1>X Analytics Dashboard</h1>
  <div id="stats"></div>
  <button id="open">Open Dashboard</button>
  <div class="hint">Browse your profile's Posts and Replies tabs on x.com to collect data — this scrapes what's already rendered on the page.</div>
  <script src="popup.js"></script>
</body>
</html>
