<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>X Analytics Dashboard</title>
<link rel="stylesheet" href="dashboard.css" />
</head>
<body>
  <header>
    <h1>X Analytics Dashboard</h1>
    <div class="controls">
      <select id="typeFilter">
        <option value="all">All</option>
        <option value="posts">Posts only</option>
        <option value="replies">Replies only</option>
      </select>
      <select id="sortBy">
        <option value="views">Sort: Views</option>
        <option value="likes">Sort: Likes</option>
        <option value="reposts">Sort: Reposts</option>
        <option value="replies">Sort: Replies</option>
        <option value="createdAt">Sort: Newest</option>
      </select>
      <button id="exportCsv">Export CSV</button>
      <button id="clearData">Clear data</button>
    </div>
  </header>

  <section id="summary" class="summary"></section>

  <section class="chart-section">
    <h2>Views by post (top 15)</h2>
    <svg id="chart" width="100%" height="260"></svg>
  </section>

  <section class="table-section">
    <table>
      <thead>
        <tr>
          <th>Type</th>
          <th>Date</th>
          <th>Text</th>
          <th>Views</th>
          <th>Likes</th>
          <th>Reposts</th>
          <th>Replies</th>
          <th>Bookmarks</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </section>

  <script src="dashboard.js"></script>
</body>
</html>
